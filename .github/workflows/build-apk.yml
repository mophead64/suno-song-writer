# Builds a shareable APK on every push to master, on demand (Actions → Build APK → Run workflow),
# and for tags like v0.2.0, where it's also attached to a GitHub release.
#
# Signing: add these repository secrets (Settings → Secrets and variables → Actions) so CI builds are
# signed with the same key as `make apk` and install as updates over each other:
#   SIGNING_KEYSTORE_BASE64  base64 of ~/.android/song-writer-release.jks
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD  from keystore.properties
# Without them, the workflow builds a debug APK instead (installs fine, but can't update another build).
name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the APK to releases for tags

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: building a debug APK. Add the SIGNING_* secrets for signed release builds."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.release == 'true'
        run: scripts/build-apk.sh

      - name: Build debug APK
        if: steps.signing.outputs.release != 'true'
        run: |
          ./gradlew --no-daemon assembleDebug -PversionCode="$(date +%y%m%d%H)"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SongWriter-debug-$(date +%Y%m%d.%H%M).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: song-writer-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
